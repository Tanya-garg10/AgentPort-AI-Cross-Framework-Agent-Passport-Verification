spec_version: "0.1.0"
name: agent-port
version: "1.0.0"
description: Portable AI agent with verifiable identity, tools and behavior contracts
author: "AgentPort Working Group <spec@agentport.org>"
license: "Apache-2.0"

tools:
  - risk-check
  - approval-request
  - audit-log
  - agent-status

skills:
  - security-review
  - risk-analysis
  - audit-report

compliance:
  risk_tier: high
  supervision:
    human_in_the_loop: always
  recordkeeping:
    audit_logging: true
    retention_period: "7y"
  segregation_of_duties:
    roles:
      - id: maker
        permissions: [propose, draft]
      - id: checker
        permissions: [review, approve, reject]
      - id: executor
        permissions: [execute]
      - id: auditor
        permissions: [audit, verify]
    conflicts:
      - [maker, checker]
    enforcement: strict
